<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MajaPOP!">
  <title>Masukkan Kode – MajaPOP!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div id="stepper" data-aktif="tim"></div>

    <section class="halaman-judul">
      <span class="label-atas">Langkah 1</span>
      <h1 style="font-size:clamp(2rem,5vw,3rem)" id="judul">Masukkan Kode 🔑</h1>
      <p id="subjudul">Masukkan kode 4 angka dari guru untuk bergabung ke sesi kelas.</p>
    </section>

    <form id="form-tim" class="kartu" novalidate>
      <div class="field kode-sesi" id="field-kode" hidden>
        <label for="kode">📡 Kode sesi dari guru</label>
        <input type="text" id="kode" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Contoh: 4821" autocomplete="off">
        <p class="kecil" style="margin:6px 0 0">Kode ditampilkan di layar guru. Form akan menyesuaikan jenis sesinya: kelompok atau individu.</p>
        <div class="aksi"><button type="button" class="btn" id="cek-kode">Masuk Sesi →</button></div>
      </div>

      <div id="isian" hidden>
        <div class="info-sesi" id="info-sesi" hidden>
          <span id="info-sesi-teks"></span>
          <button type="button" id="ganti-kode">Ganti kode</button>
        </div>

        <div class="dua-kolom">
          <div class="field">
            <label for="tim" id="label-tim">Nama kelompok</label>
            <input type="text" id="tim" maxlength="40" placeholder="Contoh: Kelompok Pelangi" required>
          </div>
          <div class="field">
            <label for="kelas">Kelas <span class="kecil">(opsional)</span></label>
            <input type="text" id="kelas" maxlength="20" placeholder="Contoh: X IPA 2">
          </div>
        </div>

        <div class="field" id="field-absen" hidden>
          <label for="absen">No. absen</label>
          <input type="text" id="absen" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="Contoh: 12" autocomplete="off" style="max-width:160px">
        </div>

        <div id="bagian-kelompok">
          <div class="field">
            <label>Anggota kelompok</label>
            <div id="anggota-list"></div>
            <button type="button" class="btn btn-kecil btn-garis" id="tambah-anggota">+ Tambah anggota</button>
          </div>

          <div class="field">
            <div class="aksi" style="justify-content:space-between;margin-bottom:10px">
              <label style="margin:0">Pembagian peran</label>
              <button type="button" class="btn btn-kecil btn-kuning" id="acak-peran">🎲 Bagi otomatis</button>
            </div>
            <div class="peran-grid" id="peran-grid"></div>
          </div>
        </div>

        <div class="aksi aksi-lekat" style="justify-content:flex-end">
          <button type="submit" class="btn">Simpan &amp; Lanjut Putar Lagu →</button>
        </div>
      </div>
    </form>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/sesi.js"></script>
  <script>
    const state = loadState();
    const listEl = document.getElementById('anggota-list');
    const peranEl = document.getElementById('peran-grid');
    const timEl = document.getElementById('tim');
    const absenEl = document.getElementById('absen');
    const kodeEl = document.getElementById('kode');
    const cekEl = document.getElementById('cek-kode');
    timEl.value = state.tim;
    absenEl.value = state.absen || '';
    document.getElementById('kelas').value = state.kelas;

    // Sesi Kelas: kode dari guru wajib diisi dulu, lalu form mengikuti jenis sesinya (kelompok / individu).
    // Tanpa Firebase, form kelompok langsung tampil seperti biasa.
    const pakaiSesi = SESI.aktif();
    let sesiDipilih = null;
    let modeForm = state.tim ? SESI.modeSesi(state.sesi) : null;
    let urutanCek = 0;

    function individu() {
      return Boolean(sesiDipilih && sesiDipilih.mode === 'individu');
    }

    function tampilkanForm(sesi) {
      sesiDipilih = sesi;
      const mode = sesi ? sesi.mode : 'kelompok';
      // Pindah jenis sesi: isian lama (nama kelompok/anggota atau nama siswa) dikosongkan.
      if (modeForm && modeForm !== mode) {
        timEl.value = '';
        absenEl.value = '';
        listEl.innerHTML = '';
        ['', '', '', ''].forEach((a) => barisAnggota(a));
        renderPeran({});
      }
      modeForm = mode;
      const indiv = mode === 'individu';
      document.getElementById('judul').textContent = indiv ? 'Data Diri 👤' : 'Masukkan Kode 🔑';
      document.getElementById('subjudul').textContent = indiv
        ? 'Sesi ini dikerjakan sendiri. Tulis nama, kelas, dan nomor absenmu agar progresmu muncul di layar guru.'
        : 'Bentuk kelompok, tulis nama anggota, lalu bagi peran secara seimbang: dengar lagu, tebak majas, temukan makna, dan susun puzzle.';
      document.getElementById('label-tim').textContent = indiv ? 'Nama siswa' : 'Nama kelompok';
      timEl.placeholder = indiv ? 'Contoh: Ayu Lestari' : 'Contoh: Kelompok Pelangi';
      document.getElementById('field-absen').hidden = !indiv;
      document.getElementById('bagian-kelompok').hidden = indiv;
      document.getElementById('info-sesi').hidden = !sesi;
      if (sesi) document.getElementById('info-sesi-teks').textContent = `📡 Sesi ${sesi.kode} · ${indiv ? '👤 Individu' : '👥 Kelompok'}`;
      document.getElementById('field-kode').hidden = Boolean(sesi) || !pakaiSesi;
      document.getElementById('isian').hidden = false;
    }

    function tutupForm() {
      urutanCek++;
      sesiDipilih = null;
      document.getElementById('isian').hidden = true;
      document.getElementById('field-kode').hidden = false;
      document.getElementById('judul').textContent = 'Masukkan Kode 🔑';
      document.getElementById('subjudul').textContent = 'Masukkan kode 4 angka dari guru untuk bergabung ke sesi kelas.';
    }

    async function cekKode() {
      const kode = kodeEl.value.trim();
      if (!/^\d{4}$/.test(kode)) { toast('Masukkan kode sesi 4 angka dari guru.'); kodeEl.focus(); return; }
      const ke = ++urutanCek;
      cekEl.disabled = true;
      cekEl.textContent = 'Memeriksa kode…';
      try {
        const sesi = await SESI.gabung(kode);
        if (ke !== urutanCek) return; // kode sudah diganti saat menunggu
        tampilkanForm(sesi);
        timEl.focus();
      } catch (err) {
        if (ke !== urutanCek) return;
        toast(err.message);
        kodeEl.focus();
      } finally {
        cekEl.disabled = false;
        cekEl.textContent = 'Masuk Sesi →';
      }
    }

    function barisAnggota(nama = '') {
      const div = document.createElement('div');
      div.className = 'anggota-baris';
      div.innerHTML = `<input type="text" maxlength="40" placeholder="Nama anggota" value="${esc(nama)}">
        <button type="button" class="btn-hapus" aria-label="Hapus anggota">✕</button>`;
      div.querySelector('input').addEventListener('input', () => renderPeran());
      div.querySelector('.btn-hapus').addEventListener('click', () => {
        if (listEl.children.length > 1) { div.remove(); renderPeran(); }
      });
      listEl.appendChild(div);
    }

    function daftarAnggota() {
      return [...listEl.querySelectorAll('input')].map((i) => i.value.trim()).filter(Boolean);
    }

    function renderPeran(pilihan) {
      const anggota = daftarAnggota();
      const sekarang = pilihan || Object.fromEntries(PERAN.map((p) => [p.id, peranEl.querySelector(`#peran-${p.id}`)?.value || '']));
      peranEl.innerHTML = PERAN.map((p) => `
        <div class="peran-kartu">
          <label for="peran-${p.id}">${p.ikon} ${p.label}</label>
          <select id="peran-${p.id}">
            <option value="">— pilih anggota —</option>
            ${anggota.map((a) => `<option ${a === sekarang[p.id] ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select>
        </div>`).join('');
    }

    (state.anggota.length && modeForm === 'kelompok' ? state.anggota : ['', '', '', '']).forEach((a) => barisAnggota(a));
    renderPeran(modeForm === 'kelompok' ? state.peran : {});

    if (pakaiSesi) {
      document.getElementById('field-kode').hidden = false;
      // Kode bisa terisi otomatis dari link/QR guru (?kode=1234) atau dari sesi terakhir.
      const dariLink = new URLSearchParams(location.search).get('kode');
      kodeEl.value = (dariLink && /^\d{4}$/.test(dariLink)) ? dariLink : (state.sesi ? state.sesi.kode : '');
      kodeEl.addEventListener('input', () => {
        kodeEl.value = kodeEl.value.replace(/\D/g, '').slice(0, 4);
        if (kodeEl.value.length === 4) cekKode();
      });
      cekEl.addEventListener('click', cekKode);
      document.getElementById('ganti-kode').addEventListener('click', () => { tutupForm(); kodeEl.select(); kodeEl.focus(); });
      if (kodeEl.value) cekKode();
    } else {
      tampilkanForm(null);
    }

    absenEl.addEventListener('input', () => { absenEl.value = absenEl.value.replace(/\D/g, '').slice(0, 2); });

    document.getElementById('tambah-anggota').addEventListener('click', () => {
      barisAnggota();
      listEl.lastElementChild.querySelector('input').focus();
    });

    // Bagi peran seimbang: anggota diacak lalu dibagikan bergiliran.
    document.getElementById('acak-peran').addEventListener('click', () => {
      const anggota = acak(daftarAnggota());
      if (!anggota.length) { toast('Tulis nama anggota dulu ya!'); return; }
      const hasil = {};
      PERAN.forEach((p, i) => { hasil[p.id] = anggota[i % anggota.length]; });
      renderPeran(hasil);
    });

    document.getElementById('form-tim').addEventListener('submit', async (e) => {
      e.preventDefault();
      // Enter di kotak kode: periksa kodenya dulu.
      if (document.getElementById('isian').hidden) { cekKode(); return; }
      if (pakaiSesi && !sesiDipilih) { toast('Masukkan kode sesi dari guru dulu.'); return; }

      const indiv = individu();
      const nama = timEl.value.trim();
      const kelas = document.getElementById('kelas').value.trim();
      let anggota, peran, absen = '';
      if (indiv) {
        absen = Number(absenEl.value);
        if (!nama) { toast('Nama siswa belum diisi.'); timEl.focus(); return; }
        if (!(absen >= 1 && absen <= 99)) { toast('No. absen belum diisi (1–99).'); absenEl.focus(); return; }
        anggota = [nama];
        peran = Object.fromEntries(PERAN.map((p) => [p.id, nama])); // semua peran dikerjakan sendiri
      } else {
        anggota = daftarAnggota();
        if (!nama) { toast('Nama kelompok belum diisi.'); timEl.focus(); return; }
        if (!anggota.length) { toast('Isi minimal satu nama anggota.'); return; }
        peran = Object.fromEntries(PERAN.map((p) => [p.id, document.getElementById(`peran-${p.id}`).value]));
        if (PERAN.some((p) => !peran[p.id])) { toast('Semua peran harus punya anggota. Coba "Bagi otomatis".'); return; }
      }

      updateState((s) => {
        s.tim = nama;
        s.kelas = kelas;
        s.anggota = anggota;
        s.peran = peran;
        s.absen = absen;
        s.sesi = sesiDipilih;
      });
      tandaiSelesai('tim');
      if (sesiDipilih) await SESI.kirimSegera(); // pastikan langsung muncul di dashboard guru
      location.href = 'lagu.html';
    });
  </script>
</body>
</html>
