<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#FFF8EC">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MajaPOP!">
  <title>Kirim Hasil – MajaPOP!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div id="stepper" data-aktif="unggah"></div>
    <div id="banner-tim"></div>

    <section class="halaman-judul">
      <span class="label-atas">Langkah 6</span>
      <h1 style="font-size:clamp(2rem,5vw,3rem)">Kirim Hasil ke Guru 📤</h1>
      <p>Periksa lagi jawaban kalian di bawah, lalu tekan <b>Kirim ke Guru</b>. Hasilnya langsung tercatat di dashboard guru.</p>
    </section>

    <div class="ringkasan-grid">
      <div class="kartu"><b id="r-identifikasi">0/8</b><span class="kecil">majas teridentifikasi</span></div>
      <div class="kartu"><b id="r-pertama">0</b><span class="kecil">tepat di tebakan pertama</span></div>
      <div class="kartu"><b id="r-puzzle">–</b><span class="kecil">skor puzzle</span></div>
      <div class="kartu"><b id="r-cipta">0</b><span class="kecil">majas buatan</span></div>
    </div>

    <div class="kartu">
      <h2 style="font-size:1.3rem;margin:0" id="judul-jawaban">Jawaban yang akan dikirim</h2>
      <p class="kecil" id="identitas" style="margin:4px 0 0"></p>
      <div id="jawaban"></div>
      <div class="aksi aksi-penuh" style="margin-top:18px">
        <button class="btn" id="kirim">📤 Kirim ke Guru</button>
      </div>
      <p class="status-kirim" id="status-kirim" aria-live="polite"></p>
    </div>

    <div class="tengah" style="margin-top:36px">
      <p class="kecil">Ingin bermain lagi dengan kelompok lain?</p>
      <button class="btn btn-garis" id="reset">↻ Main lagi dari awal</button>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/sesi.js"></script>
  <script src="js/jawaban.js"></script>
  <script>
    cekTim(document.getElementById('banner-tim'));
    const state = loadState();
    const d = (id) => state.lagu[id] || {};
    const siap = daftarLaguSiap();
    const benar = siap.filter((l) => d(l.id).benar);
    const pertama = benar.filter((l) => d(l.id).percobaan === 1).length;

    document.getElementById('r-identifikasi').textContent = `${benar.length}/${siap.length}`;
    document.getElementById('r-pertama').textContent = pertama;
    document.getElementById('r-puzzle').textContent = state.puzzle ? state.puzzle.skor : '–';
    document.getElementById('r-cipta').textContent = state.ciptaan.length;

    const indiv = sesiIndividu(state);

    document.getElementById('identitas').textContent = indiv
      ? `${state.tim || '-'} · No. absen ${state.absen || '-'}${state.kelas ? ` · ${state.kelas}` : ''}`
      : `${state.tim || '-'}${state.kelas ? ` (${state.kelas})` : ''} · Anggota: ${state.anggota.join(', ') || '-'}`;
    // Pratinjau memakai tampilan yang sama dengan yang dilihat guru (uid tidak diperlukan di sini).
    const pratinjau = {
      lagu: Object.fromEntries(LAGU.filter((l) => state.lagu[l.id]).map((l) => [l.id, state.lagu[l.id]])),
      ...(indiv ? {} : { peran: state.peran }),
      puzzle: state.puzzle,
      ciptaan: state.ciptaan,
    };
    document.getElementById('jawaban').innerHTML = JAWABAN.html(pratinjau);

    const statusEl = document.getElementById('status-kirim');
    const tombol = document.getElementById('kirim');
    function tampilStatus(waktu) {
      statusEl.className = 'status-kirim terkirim';
      statusEl.textContent = `✅ Terkirim ke guru pukul ${new Date(waktu).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}. Jawaban yang diubah setelah ini tetap ikut terkirim.`;
      tombol.textContent = '📤 Kirim ulang';
    }
    const bisaKirim = Boolean(state.sesi && state.sesi.kode && SESI.aktif());
    if (!bisaKirim) {
      tombol.disabled = true;
      statusEl.className = 'status-kirim';
      statusEl.textContent = '⚠️ Hasil hanya bisa dikirim lewat sesi kelas. Masukkan kode sesi dari guru di halaman Masukkan Kode.';
    } else if (state.dikirim) tampilStatus(state.dikirim);

    tombol.addEventListener('click', async () => {
      tombol.disabled = true;
      tombol.textContent = 'Mengirim…';
      const waktu = Date.now();
      updateState((s) => { s.dikirim = waktu; });
      const ok = await SESI.kirimSegera();
      tombol.disabled = false;
      if (ok) {
        tandaiSelesai('unggah');
        tampilStatus(waktu);
        toast('✅ Hasil terkirim ke guru!');
        return;
      }
      tombol.textContent = '📤 Kirim ke Guru';
      const info = await SESI.infoSesi(state.sesi.kode).catch(() => null);
      statusEl.className = 'status-kirim';
      statusEl.textContent = info && !info.aktif
        ? `⏹ Sesi ${state.sesi.kode} sudah diakhiri guru, jadi hasil tidak bisa dikirim lagi.`
        : '⚠️ Belum terkirim. Periksa koneksi internet lalu coba lagi.';
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (confirm(`Hapus semua progres ${indiv ? 'kamu' : 'kelompok ini'} dan mulai dari awal?`)) {
        resetState();
        location.href = 'masuk.html';
      }
    });
  </script>
</body>
</html>
